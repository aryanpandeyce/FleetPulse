global:
  environment: production
  imagePullPolicy: IfNotPresent

gateway:
  replicaCount: 2
  image:
    repository: fleetpulse/gateway
    tag: "1.0.0"
  port: 8080
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilizationPercentage: 70
  pdb:
    enabled: true
    minAvailable: 1

inventory:
  replicaCount: 2
  image:
    repository: fleetpulse/inventory-service
    tag: "1.0.0"
  port: 50051
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

telemetry:
  replicaCount: 3
  image:
    repository: fleetpulse/telemetry-service
    tag: "1.0.0"
  port: 50052
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 128Mi
  autoscaling:
    enabled: true
    minReplicas: 3
    maxReplicas: 15
    targetCPUUtilizationPercentage: 75
  pdb:
    enabled: true
    minAvailable: 2

workflow:
  replicaCount: 2
  image:
    repository: fleetpulse/workflow-service
    tag: "1.0.0"
  port: 50053
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 100m
      memory: 64Mi

simulator:
  replicaCount: 1
  image:
    repository: fleetpulse/device-simulator
    tag: "1.0.0"
  port: 8081
  deviceCount: 1000
  interval: 5
  resources:
    limits:
      cpu: 1000m
      memory: 512Mi
    requests:
      cpu: 200m
      memory: 128Mi

ingress:
  enabled: true
  className: "nginx"
  hosts:
    - host: fleetpulse.local
      paths:
        - path: /
          pathType: Prefix
