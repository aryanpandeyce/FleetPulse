global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "gateway"
    static_configs:
      - targets: ["gateway:8080"]

  - job_name: "inventory-service"
    static_configs:
      - targets: ["inventory-service:50051"]

  - job_name: "telemetry-service"
    static_configs:
      - targets: ["telemetry-service:50052"]

  - job_name: "workflow-service"
    static_configs:
      - targets: ["workflow-service:50053"]
