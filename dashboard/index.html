<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetPulse &bull; Cloud-Native Server Fleet Management</title>
  <meta name="description" content="Enterprise server fleet management platform inspired by Cisco Intersight. Real-time telemetry, anomaly detection, firmware compliance, and priority workflow orchestration.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Demo Mode Banner -->
  <div class="demo-banner">
    <div style="display: flex; align-items: center; gap: 8px;">
      <span class="demo-badge">DEMO DATA</span>
      <span>Simulated real-time UCS telemetry stream (Active RNG Seed #42 &bull; 5s sample interval)</span>
    </div>
    <div style="display: flex; gap: 12px; align-items: center;">
      <span style="color: var(--text-muted); font-size: 12px;">Mode: Standalone In-Browser Simulation</span>
    </div>
  </div>

  <!-- Header -->
  <header class="header">
    <div class="logo-group">
      <div class="logo-radar">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M2 12h5l2-7 4 14 3-7h6"></path>
        </svg>
      </div>
      <div>
        <div class="logo-title">FleetPulse</div>
        <div class="logo-subtitle">Enterprise Fleet Control</div>
      </div>
    </div>

    <div class="header-controls">
      <label for="tenant-selector" style="font-size: 12px; color: var(--text-secondary); font-weight: 500;">Tenant:</label>
      <select id="tenant-selector" class="tenant-select">
        <option value="acme">Acme Corporation (Tenant A)</option>
        <option value="globex">Globex Industries (Tenant B)</option>
      </select>
    </div>
  </header>

  <!-- Main Container -->
  <div class="app-container">
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
      <div class="nav-item active" data-view="overview">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9"></rect><rect x="14" y="3" width="7" height="5"></rect><rect x="14" y="12" width="7" height="9"></rect><rect x="3" y="16" width="7" height="5"></rect></svg>
        <span>Fleet Overview</span>
      </div>
      <div class="nav-item" data-view="devices">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="8" rx="2" ry="2"></rect><rect x="2" y="14" width="20" height="8" rx="2" ry="2"></rect><line x1="6" y1="6" x2="6.01" y2="6"></line><line x1="6" y1="18" x2="6.01" y2="18"></line></svg>
        <span>Server Inventory</span>
      </div>
      <div class="nav-item" data-view="device-detail">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20v-6M6 20V10M18 20V4"></path></svg>
        <span>Device Detail</span>
      </div>
      <div class="nav-item" data-view="alarms">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
        <span>Alarms & Anomalies</span>
      </div>
      <div class="nav-item" data-view="workflows">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
        <span>Workflows</span>
      </div>
    </nav>

    <!-- Content Area -->
    <main class="content-area" id="main-content">
      <!-- Injected via app.js -->
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
